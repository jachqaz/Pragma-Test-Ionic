# .github/workflows/main.yml
name: Ionic CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # =================================================================
  # 1. BUILD WEB (PWA) - Genera y sube la carpeta 'www'
  # =================================================================
  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Build Web (Genera www)
        run: npm run build

      - name: 🔍 Verify www directory
        run: |
          echo "Contenido de www:"
          ls -la www/
          echo "Verificando index.html:"
          ls -la www/index.html || echo "❌ index.html no encontrado"

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: www/
          retention-days: 1

  # =================================================================
  # 2. BUILD ANDROID - Descarga 'www' y compila el APK
  # =================================================================
  build_android:
    needs: build_web
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./www-restored/  # 📍 Descarga en subdirectorio temporal

      - name: 🗂️ Restore www directory
        run: |
          echo "Contenido descargado:"
          ls -la ./www-restored/
          echo "Moviendo www a raíz..."
          rm -rf www  # Elimina www vacío si existe
          mv ./www-restored www
          echo "Verificando www restaurado:"
          ls -la www/
          ls -la www/index.html || echo "❌ index.html no encontrado después del restore"

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🔧 Clean Android Platform (if exists)
        run: |
          if [ -d "android" ]; then
            echo "🔄 Android platform exists, removing..."
            rm -rf android
          fi

      - name: 📱 Add Android Platform
        run: npx cap add android

      - name: 🏗️ Sync Web Assets & Dependencies
        run: npx cap sync android

      - name: 🛠️ Build Android Project (Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 1

  # =================================================================
  # 3. BUILD IOS - Descarga 'www' y compila el IPA
  # =================================================================
  build_ios:
    needs: build_web
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./www-restored/

      - name: 🗂️ Restore www directory
        run: |
          echo "Contenido descargado:"
          ls -la ./www-restored/
          echo "Moviendo www a raíz..."
          rm -rf www
          mv ./www-restored www
          echo "Verificando www restaurado:"
          ls -la www/
          ls -la www/index.html

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🔧 Clean iOS Platform (if exists)
        run: |
          if [ -d "ios" ]; then
            echo "🔄 iOS platform exists, removing..."
            rm -rf ios
          fi

      - name: 📱 Add iOS Platform
        run: npx cap add ios

      - name: 🏗️ Sync Web Assets & Dependencies
        run: npx cap sync ios

      - name: 🛠️ Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: 🍎 Build iOS Project (Debug IPA)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive

      - name: 📤 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa
          path: ios/App/build/App.xcarchive
          retention-days: 1
