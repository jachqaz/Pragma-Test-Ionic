# .github/workflows/main.yml
name: Ionic CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # =================================================================
  # 1. BUILD WEB (PWA) - Genera y sube la carpeta 'www'
  # =================================================================
  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚙️ Build Web (Genera www)
        # Asegúrate de que este script genera la carpeta 'www'
        run: npm run build

      - name: 📤 Upload Web Artifact
        # Sube la carpeta 'www' como un artefacto llamado 'web-build'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: www
          if-no-files-found: error # Fallará si 'www' no existe

  # =================================================================
  # 2. BUILD ANDROID - Descarga 'www' y compila el APK
  # =================================================================
  build_android:
    needs: build_web
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        # PASO CRUCIAL: Descarga la carpeta 'www' al directorio raíz del job
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: . # Descarga el contenido del artefacto (la carpeta www) a la raíz

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 📱 Add Android Platform (if missing)
        # Esto solo asegura que la estructura básica esté presente
        run: npx cap add android || true

      - name: 🏗️ Sync Web Assets & Dependencies
        # Ahora el 'sync' debería funcionar porque 'www' existe
        run: npx cap sync android

      - name: 🛠️ Build Android Project (Debug APK)
        uses: eskatos/gradle-command-action@v2
        with:
          arguments: assembleDebug

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # =================================================================
  # 3. BUILD IOS - Descarga 'www' y compila el IPA
  # =================================================================
  build_ios:
    needs: build_web
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        # PASO CRUCIAL: Descarga la carpeta 'www' al directorio raíz del job
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: . # Descarga el contenido del artefacto (la carpeta www) a la raíz

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 📱 Add iOS Platform (if missing)
        run: npx cap add ios || true

      - name: 🏗️ Sync Web Assets & Dependencies
        run: npx cap sync ios

      - name: 🛠️ Install CocoaPods
        run: cd ios/App && pod install

      - name: 🍎 Build iOS Project (Debug App)
        uses: yukiarrr/ios-build-action@v1
        with:
          project-path: ios/App/App.xcworkspace
          scheme: App
          configuration: Debug
          output-path: build/ios-debug.ipa
          export-method: development

      - name: 📤 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa
          path: build/ios-debug.ipa
