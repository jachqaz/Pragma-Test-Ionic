name: Ionic CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      web-artifact: ${{ steps.upload-web.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Create Firebase Config
        run: |
          cat > src/environments/firebase.config.ts << EOF
          import {FirebaseOptions} from 'firebase/app';
          export const firebaseConfig: FirebaseOptions = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: 📦 Install Dependencies
        run: npm ci
      - name: ⚙️ Build Web
        run: npm run build -- --configuration=production

      - id: upload-web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: www

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Dependencies
        run: npm ci
      - name: 📥 Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: www

      - name: 🤖 Build Android APK
        run: |
          npm install -g @capacitor/cli
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci
      - name: 📥 Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: www

      - name: 🍎 Setup iOS Platform
        run: |
          npm install -g @capacitor/cli
          npx cap add ios
          npx cap sync ios
          cd ios/App && pod install

      - name: 🏗️ Build iOS Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -archivePath build/App.xcarchive archive

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/App/build/App.xcarchive
