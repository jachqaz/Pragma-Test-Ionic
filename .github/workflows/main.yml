name: Ionic CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # =================================================================
  # 1. BUILD WEB - Con variables de Firebase
  # =================================================================
  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Create Firebase Config
        run: |
          cat > src/environments/firebase.config.ts << EOF
          import {FirebaseOptions} from 'firebase/app';
          
          export const firebaseConfig: FirebaseOptions = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: 📦 Install Dependencies
        run: npm install -g ionic cordova && npm ci

      - name: ⚙️ Build Web
        run: npm run build

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: www

  # =================================================================
  # 2. BUILD ANDROID - Ya funciona con Java 21
  # =================================================================
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Create Firebase Config
        run: |
          cat > src/environments/firebase.config.ts << EOF
          import {FirebaseOptions} from 'firebase/app';
          
          export const firebaseConfig: FirebaseOptions = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: 📦 Install Dependencies
        run: npm install -g ionic cordova cordova-res && npm ci

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 Add Android Platform
        run: ionic cordova platform add android --confirm

      - name: 🔨 Build Web for Cordova
        run: ng run app:ionic-cordova-build:production

      - name: 📱 Build Android APK
        run: ionic cordova build android --prod --release

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk

  # =================================================================
  # 3. BUILD IOS - Con variables de Firebase
  # =================================================================
  build_ios:
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Create Firebase Config
        run: |
          cat > src/environments/firebase.config.ts << EOF
          import {FirebaseOptions} from 'firebase/app';
          
          export const firebaseConfig: FirebaseOptions = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: 📦 Install Dependencies
        run: npm install -g ionic cordova cordova-res && npm ci

      - name: 📱 Add iOS Platform
        run: ionic cordova platform add ios --confirm

      - name: 🔨 Build Web for Cordova
        run: ng run app:ionic-cordova-build:production

      - name: 📱 Build iOS App
        run: ionic cordova build ios --prod

      - name: 📤 Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: platforms/ios/build/device/
