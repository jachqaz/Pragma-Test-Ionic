# .github/workflows/main.yml
name: Ionic CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # =================================================================
  # 1. BUILD WEB (PWA)
  # Este job debe ejecutarse primero para generar la carpeta 'www'
  # =================================================================
  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚙️ Build Web (Genera www)
        # Asume que en tu package.json tienes: "build": "ionic build --prod"
        run: npm run build

      - name: 🔍 Verify www folder exists
        # Comprobación de seguridad para asegurar que la compilación anterior fue exitosa
        run: |
          if [ ! -d "www" ]; then
            echo "Error: The 'www' directory was not generated. Check your 'npm run build' script."
            exit 1
          fi

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: www

  # =================================================================
  # 2. BUILD ANDROID
  # =================================================================
  build_android:
    needs: build_web # Debe esperar el build web
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 📱 Add Android Platform (if missing)
        # Este paso está fallando porque la carpeta 'android' ya está en el repositorio.
        # Lo mantenemos, pero el error "platform already exists" no detiene el job por el || true
        run: npx cap add android || true

      - name: 🏗️ Sync Web Assets & Dependencies
        # sync hace copy y update de dependencias, crucial para el gradlew
        run: npx cap sync android

      - name: 🛠️ Build Android Project (Debug APK)
        uses: eskatos/gradle-command-action@v2
        with:
          # Debe encontrar el gradlew después del sync
          arguments: assembleDebug

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # =================================================================
  # 3. BUILD IOS
  # =================================================================
  build_ios:
    needs: build_web
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 📱 Add iOS Platform (if missing)
        run: npx cap add ios || true

      - name: 🏗️ Sync Web Assets & Dependencies
        run: npx cap sync ios

      - name: 🛠️ Install CocoaPods
        # Usa el comando "pod install" después de que "cap sync" haya copiado
        run: cd ios/App && pod install

      - name: 🍎 Build iOS Project (Debug App)
        uses: yukiarrr/ios-build-action@v1
        with:
          project-path: ios/App/App.xcworkspace
          scheme: App
          configuration: Debug
          output-path: build/ios-debug.ipa
          export-method: development

      - name: 📤 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa
          path: build/ios-debug.ipa
