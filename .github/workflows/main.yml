name: Ionic CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  verify_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Verify All Firebase Secrets
        run: |
          echo "🔍 Verificando Firebase Secrets..."
          echo "======================================"

          declare -a required_secrets=(
            "FIREBASE_API_KEY"
            "FIREBASE_AUTH_DOMAIN"
            "FIREBASE_PROJECT_ID"
            "FIREBASE_STORAGE_BUCKET"
            "FIREBASE_MESSAGING_SENDER_ID"
            "FIREBASE_APP_ID"
            "FIREBASE_MEASUREMENT_ID"
          )

          all_secrets_ok=true

          for secret in "${required_secrets[@]}"; do
            # Usar eval para acceder dinámicamente a los secrets
            secret_value="${{ secrets[secret] }}"

            if [ -z "$secret_value" ]; then
              echo "❌ $secret: NO DEFINIDO o VACÍO"
              all_secrets_ok=false
            else
              # Mostrar longitud y primeros/últimos caracteres (sin revelar completo)
              secret_length=${#secret_value}
              first_chars="${secret_value:0:4}"
              last_chars="${secret_value: -4}"
              echo "✅ $secret: DEFINIDO (Longitud: $secret_length) → ${first_chars}...${last_chars}"
            fi
          done

          echo "======================================"

          if [ "$all_secrets_ok" = false ]; then
            echo "❌ ALGUNOS SECRETS NO ESTÁN DEFINIDOS"
            echo ""
            echo "📝 INSTRUCCIONES:"
            echo "1. Ve a Settings → Secrets and variables → Actions"
            echo "2. Asegúrate de que todos los secrets de Firebase están definidos"
            echo "3. Los nombres deben ser EXACTAMENTE iguales (case-sensitive)"
            exit 1
          else
            echo "🎉 TODOS LOS SECRETS ESTÁN DEFINIDOS CORRECTAMENTE"
          fi

      - name: 🔧 Test Environment File Creation
        run: |
          echo "🧪 Probando creación del archivo environment..."
          mkdir -p src/environments

          cat > src/environments/environment.prod.ts << EOF
          export const environment = {
            production: true,
            firebase: {
              apiKey: "${{ secrets.FIREBASE_API_KEY }}",
              authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
              storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              appId: "${{ secrets.FIREBASE_APP_ID }}",
              measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
            }
          };
          EOF

          echo "✅ Archivo environment.prod.ts creado"
          echo "📄 Contenido (ocultando valores sensibles):"
          # Mostrar estructura pero ocultar valores reales
          sed 's/".*"/"[REDACTED]"/g' src/environments/environment.prod.ts

      - name: 🔎 Verify File Content
        run: |
          echo "🔎 Verificando contenido del archivo..."
          if [ ! -f "src/environments/environment.prod.ts" ]; then
            echo "❌ ERROR: No se creó el archivo"
            exit 1
          fi

          # Verificar que no hay placeholders sin reemplazar
          if grep -q '\${{' src/environments/environment.prod.ts; then
            echo "❌ ERROR: Variables sin reemplazar detectadas"
            grep -n '\${{' src/environments/environment.prod.ts
            exit 1
          else
            echo "✅ Todas las variables fueron reemplazadas correctamente"
          fi

          # Verificar estructura Firebase
          declare -a firebase_keys=("apiKey" "authDomain" "projectId" "storageBucket" "messagingSenderId" "appId" "measurementId")
          for key in "${firebase_keys[@]}"; do
            if grep -q "$key" src/environments/environment.prod.ts; then
              echo "✅ $key: presente en archivo"
            else
              echo "❌ $key: ausente en archivo"
              exit 1
            fi
          done

          echo "🎉 Verificación completada - Archivo creado correctamente"
