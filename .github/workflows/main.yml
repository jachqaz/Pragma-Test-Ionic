name: Verify Firebase Secrets

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  verify_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Verify Firebase Secrets
        run: |
          echo "🔍 Verificando Firebase Secrets..."
          echo "======================================"
          
          API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          APP_ID="${{ secrets.FIREBASE_APP_ID }}"
          MEASUREMENT_ID="${{ secrets.FIREBASE_MEASUREMENT_ID }}"

          all_ok=true

          [ -n "$API_KEY" ] && echo "✅ FIREBASE_API_KEY: DEFINIDO" || { echo "❌ FIREBASE_API_KEY: NO DEFINIDO"; all_ok=false; }
          [ -n "$AUTH_DOMAIN" ] && echo "✅ FIREBASE_AUTH_DOMAIN: DEFINIDO" || { echo "❌ FIREBASE_AUTH_DOMAIN: NO DEFINIDO"; all_ok=false; }
          [ -n "$PROJECT_ID" ] && echo "✅ FIREBASE_PROJECT_ID: DEFINIDO" || { echo "❌ FIREBASE_PROJECT_ID: NO DEFINIDO"; all_ok=false; }
          [ -n "$STORAGE_BUCKET" ] && echo "✅ FIREBASE_STORAGE_BUCKET: DEFINIDO" || { echo "❌ FIREBASE_STORAGE_BUCKET: NO DEFINIDO"; all_ok=false; }
          [ -n "$MESSAGING_SENDER_ID" ] && echo "✅ FIREBASE_MESSAGING_SENDER_ID: DEFINIDO" || { echo "❌ FIREBASE_MESSAGING_SENDER_ID: NO DEFINIDO"; all_ok=false; }
          [ -n "$APP_ID" ] && echo "✅ FIREBASE_APP_ID: DEFINIDO" || { echo "❌ FIREBASE_APP_ID: NO DEFINIDO"; all_ok=false; }
          [ -n "$MEASUREMENT_ID" ] && echo "✅ FIREBASE_MEASUREMENT_ID: DEFINIDO" || { echo "❌ FIREBASE_MEASUREMENT_ID: NO DEFINIDO"; all_ok=false; }

          echo "======================================"
          if [ "$all_ok" = true ]; then
            echo "🎉 TODOS LOS SECRETS ESTÁN DEFINIDOS"
          else
            echo "❌ FALTAN ALGUNOS SECRETS"
            echo "📝 Ve a Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: 🔧 Test Simple File Creation
        run: |
          echo "🧪 Probando creación simple del archivo..."
          mkdir -p src/environments

          # Crear archivo de forma simple
          cat > src/environments/environment.prod.ts << 'EOF'
          export const environment = {
            production: true,
            firebase: {
              apiKey: "$FIREBASE_API_KEY",
              authDomain: "$FIREBASE_AUTH_DOMAIN",
              projectId: "$FIREBASE_PROJECT_ID",
              storageBucket: "$FIREBASE_STORAGE_BUCKET",
              messagingSenderId: "$FIREBASE_MESSAGING_SENDER_ID",
              appId: "$FIREBASE_APP_ID",
              measurementId: "$FIREBASE_MEASUREMENT_ID"
            }
          };
          EOF

          echo "✅ Archivo template creado"
          echo "📄 Estructura del archivo:"
          cat src/environments/environment.prod.ts
